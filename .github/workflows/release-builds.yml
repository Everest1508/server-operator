name: Build And Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            artifact_name: linux
            build_command: npm run electron:build:linux -- --publish never
          - os: windows-latest
            label: Windows
            artifact_name: windows
            build_command: npm run electron:build -- --win nsis --publish never
          - os: macos-latest
            label: macOS
            artifact_name: macos
            build_command: npm run electron:build -- --mac dmg zip --publish never

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import Developer ID certificate (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12" ]; then echo "No MAC_CERT_P12 secret; building ad-hoc signed."; exit 0; fi
          KC="$RUNNER_TEMP/build.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build desktop artifacts
        env:
          # Signing + notarization happen in build/afterPack.mac.js, not electron-builder
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          SIGN_IDENTITY: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12 != '' && secrets.SIGN_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NODE_OPTIONS: "--max-old-space-size=8192"
          VITE_CRM_BASE_URL: "https://crm.beforth.in"
        run: ${{ matrix.build_command }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact_name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*-mac.zip
            release/*.AppImage
            release/*.deb
            release/*.snap
            release/*.7z
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Compute release tag
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            TAG="${TAG}-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          CODENAME="$(node scripts/release-codename.js "${VERSION}")"
          TITLE="Server Operator ${TAG}"
          if [ -n "${CODENAME}" ]; then
            TITLE="${TITLE} (${CODENAME})"
          fi
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"

      - name: Publish release with all artifacts
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_TITLE: ${{ steps.meta.outputs.title }}
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=()
          for p in dist-artifacts/**/*; do
            if [[ -f "$p" ]]; then
              files+=("$p")
            fi
          done
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release files found."
            exit 1
          fi
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          RANGE="${PREV:+${PREV}..}${GITHUB_SHA}"
          git log --no-merges --pretty='- %s' "$RANGE" | head -30 > notes.md
          [ -s notes.md ] || echo "Maintenance release." > notes.md
          gh release create "$RELEASE_TAG" "${files[@]}" \
            --target "${GITHUB_SHA}" \
            --title "$RELEASE_TITLE" \
            --notes-file notes.md
